name: Build and Test with Gradle

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - '**/src/**'
      - '**/build.gradle'
      - '**/gradle.properties'
      - '**/settings.gradle'
      - .github/workflows/gradle.yml

  pull_request:
    branches: [ "main", "master" ]
    paths:
      - '**/src/**'
      - '**/build.gradle'
      - '**/gradle.properties'
      - '**/settings.gradle'
      - .github/workflows/gradle.yml

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: ✨ Checkout repository
        uses: actions/checkout@v6

      - name: 🛂 Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: 🏗 Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: temurin

      - name: 📷 Begin Gradle cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 🔨 Build artifacts and Run Tests
        env:
          IS_PIPELINE: true
        run: gradle clean build --stacktrace

      - name: 🎯 Prepare mod-only artifact dir
        run: |
          mkdir -p upload-staging
          find build/libs -name "*.jar" \
            ! -name "*-sources.jar" \
            ! -name "*-javadoc.jar" \
            ! -name "*-test*.jar" \
            -exec cp {} upload-staging/ \;

      - name: 📦 Upload mod-only artifact
        uses: actions/upload-artifact@v7
        with:
          name: mod_artifact
          path: upload-staging/
          compression-level: 0

      - name: 📦 Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: artifacts
          path: 'build/libs/'
          compression-level: 0

      - name: 📝 Upload reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: 'build/reports/'

      - name: 🧨 Cleanup Gradle cache
        run: |
          rm -f ~/.gradle/caches/modules-2/modules-2.lock
          rm -f ~/.gradle/caches/modules-2/gc.properties
